# Pane border style
set -g pane-border-lines "double"

# Start window and pane indexing from 1
set -g base-index 1
setw -g pane-base-index 1
# Automatically renumber windows when one is closed
set -g renumber-windows on

# Use vi keybindings in copy mode and status line
setw -g mode-keys vi
setw -g status-keys vi

# Enable mouse support
set -g mouse on

# Reduce escape time for faster key response
set -s escape-time 0

# Increase scrollback buffer size
set -g history-limit 10000

# Terminal
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Binds
# Reload config with Alt+r
bind -n M-r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"
# Show session tree with Alt+s
bind -n M-s choose-tree -s

# Clipboard
set -g set-clipboard external

# Search forward with Alt+/
bind -n M-/ copy-mode \; command-prompt -p "(search down)" "send -X search-forward '%%%'"
# Search backward with Alt+?
bind -n M-? copy-mode \; command-prompt -p "(search up)"   "send -X search-backward '%%%'"
