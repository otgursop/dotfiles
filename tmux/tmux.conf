# Options
# Pane border style
set -g pane-border-lines "double"

# Start window and pane indexing from 1
set -g base-index 1
setw -g pane-base-index 1
# Automatically renumber windows when one is closed
set -g renumber-windows on

# Use vi keybindings in copy mode and status line
setw -g mode-keys vi
setw -g status-keys vi

# Enable mouse support
set -g mouse on

# Reduce escape time for faster key response
set -s escape-time 0

# Increase scrollback buffer size
set -g history-limit 10000

# Correct image preview (terminals with sixel are not supported)
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Clipboard
# set -g set-clipboard external

# Binds
# Reload config with Alt+r
bind -n M-r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"
# Show session tree with Alt+s
bind -n M-s choose-tree -s

# Copy to clipboard bindings (xclip)
# bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard || wl-copy 2>/dev/null"
# bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy 2>/dev/null || xclip -selection clipboard -i"

# Start visual selection with 'v'
bind -T copy-mode-vi v send -X begin-selection
# Copy selection to clipboard with 'y'
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
# Copy selection to clipboard with Enter
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
# Copy selection to clipboard on mouse drag end
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"

# Search forward with Alt+/
bind -n M-/ copy-mode \; command-prompt -p "(search down)" "send -X search-forward '%%%'"
# Search backward with Alt+?
bind -n M-? copy-mode \; command-prompt -p "(search up)"   "send -X search-backward '%%%'"
