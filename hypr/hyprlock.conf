input-field {
  size = 100, 60

  dots_size = 0.2
  dots_spacing = 0.2
  dots_center = true

  outline_thickness = 0
  outer_color = rgba(214, 95, 15, 0)
  inner_color = rgba(29, 32, 33, 0)
  rounding = 0

  font_color = rgba(168, 153, 132, 0.6)
  font_family = JetBrainsMono Nerd Font SemiBold
  fade_on_empty = false
  fade_timeout = 0
  hide_input = false

  placeholder_text =
  check_color = rgba(68, 133, 136, 0.0)
  fail_color = rgba(204, 36, 29, 0.0)
  fail_text = <i>$FAIL</i>
  invert_numlock = false

  position = 0, 45
  valign = bottom
  halign = center
}
