# date & time
label {
  text = cmd[update:100] echo -e "$(date +'%d.%m.%y') - $TIME"
  font_family = JetBrainsMono Nerd Font SemiBold
  font_size = 16

  color = rgba(235, 219, 178, 1)

  position = 0, 20
  halign = center
  valign = bottom
}

