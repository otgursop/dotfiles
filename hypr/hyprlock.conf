general {
  hide_cursor = true
  ignore_empty_input = true
  immediate_render = false
  fail_timeout = 2000
}

animations {
  enabled = false
}

background {
  # path = ~/pictures/wallpapers/wallpaper14.png
  # blur_passes = 3
  # blur_size = 3
  # noise = 0.0211
  color = rgb(29, 32, 33)
}

