[main]
# General
font=JetBrainsMono Nerd Font:pixelsize=17:style=SemiBold
icon-theme=Papirus-Dark
icons-enabled=yes

# Window geometry and padding
width=35
#lines=8
horizontal-pad=21
vertical-pad=8
inner-pad=5

# Input appearance
prompt=" > "
placeholder="..."

# Search and matching
fields=filename,name,generic
match-mode=fzf
sort-result=yes
match-counter=yes
filter-desktop=yes
show-actions=no

# Convenience features
hide-before-typing=no
auto-select=no

# Password
password-character='*'

# Application launching
terminal=foot -a '{cmd}' -T '{cmd}' {cmd}

# Window positioning
anchor=center

# Typography fine-tuning
line-height=20
letter-spacing=0.3

# Rendering and performance
dpi-aware=auto
layer=overlay
keyboard-focus=exclusive
exit-on-keyboard-focus-loss=yes
scaling-filter=lanczos3
enable-mouse=yes

# Image preview settings
image-size-ratio=1.0

# Gruvbox dark color scheme
[colors]
background=282828ff
text=d5c4a1ff
input=d5c4a1ff
prompt=928374ff
placeholder=665C54ff
message=928374ff
match=d65d0eff
selection=3c3836ff
selection-text=ebdbb2ff
selection-match=98971aff
border=d65d0eff

# Border styling
[border]
width=3
radius=0
selection-radius=0

# dmenu mode settings
[dmenu]
mode=text
exit-immediately-if-empty=no

# Enhanced navigation and editing bindings
[key-bindings]
# Execution
execute=Return KP_Enter
execute-or-next=Tab
cancel=Control+g Control+c Escape

# Navigation
prev=Up Control+p
prev-with-wrap=ISO_Left_Tab
next=Down Control+n

# Text editing
delete-line-backward=Control+u
delete-line-forward=Control+k

# Clipboard & History
clipboard-paste=Control+v
# primary-paste=Shift+Insert
# expunge=Shift+Delete
